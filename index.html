        // Local Storage persistence
        function loadState() {
            try {
                const saved = localStorage.getItem('dice_bingo_app_state');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    appState = { ...appState, ...parsed };
                }
            } catch (e) {
                console.error("Could not load local storage", e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem('dice_bingo_app_state', JSON.stringify(appState));
            } catch (e) {
                console.error("Could not save local storage", e);
            }
        }

        // Global Timer
        let globalTimer = null;
        function startGlobalTimer() {
            if (globalTimer) clearInterval(globalTimer);
            globalTimer = setInterval(() => {
                appState.stats.studySeconds++;
                if (appState.currentView === 'bingoGrid') {
                    appState.game.sessionSeconds++;
                }
                saveState();
            }, 1000);
        }

        function render() {
            const root = document.getElementById('app');
            if (!root) return;

            if (appState.darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            let html = '';
            if (appState.currentView === 'welcome') {
                html = renderWelcomeView();
            } else {
                html = `
                    <div class="flex h-full overflow-hidden">
                        ${renderSidebar()}
                        <div class="flex-1 flex flex-col min-w-0 overflow-y-auto custom-scrollbar">
                            ${renderHeaderBar()}
                            <main class="flex-1 p-4 md:p-8 max-w-7xl w-full mx-auto">
                                ${renderMainContent()}
                            </main>
                        </div>
                    </div>
                `;
            }
            root.innerHTML = html;
            attachEventListeners();
        }

        function attachEventListeners() {
            const identityForm = document.getElementById('identity-form');
            if (identityForm) {
                identityForm.onsubmit = (e) => {
                    e.preventDefault();
                    const name = document.getElementById('input-name').value.trim();
                    const cls = document.getElementById('input-class').value;
                    const att = document.getElementById('input-attendance').value.trim();
                    const sch = document.getElementById('input-school').value.trim();

                    if (!name || !sch) return;

                    appState.student.name = name;
                    appState.student.className = cls;
                    appState.student.attendanceNumber = att;
                    appState.student.school = sch;
                    appState.currentView = 'dashboard';
                    saveState();
                    render();
                };
            }

            const langToggleBtn = document.getElementById('lang-toggle-btn');
            if (langToggleBtn) {
                langToggleBtn.onclick = () => {
                    appState.lang = appState.lang === 'id' ? 'en' : 'id';
                    render();
                };
            }

            const headerLang = document.getElementById('header-lang-toggle');
            if (headerLang) {
                headerLang.onclick = () => {
                    appState.lang = appState.lang === 'id' ? 'en' : 'id';
                    render();
                };
            }

            const headerTheme = document.getElementById('header-theme-toggle');
            if (headerTheme) {
                headerTheme.onclick = () => {
                    appState.darkMode = !appState.darkMode;
                    saveState();
                    render();
                };
            }

            document.querySelectorAll('[data-nav]').forEach(btn => {
                btn.onclick = () => {
                    appState.currentView = btn.getAttribute('data-nav');
                    render();
                };
            });

            const logoutBtn = document.getElementById('sidebar-logout');
            if (logoutBtn) {
                logoutBtn.onclick = () => {
                    appState.currentView = 'welcome';
                    render();
                };
            }

            document.querySelectorAll('.level-card').forEach(card => {
                card.onclick = () => {
                    const lvl = card.getAttribute('data-level');
                    startDiceGame(lvl, 'Vocabulary Bingo');
                };
            });

            const startQuickDice = document.getElementById('start-quick-dice');
            if (startQuickDice) {
                startQuickDice.onclick = () => {
                    startDiceGame('STARTER', 'Vocabulary Bingo');
                };
            }

            const goToPlay = document.getElementById('go-to-play');
            if (goToPlay) {
                goToPlay.onclick = () => {
                    appState.currentView = 'play';
                    render();
                };
            }

            document.querySelectorAll('.play-level-btn').forEach(btn => {
                btn.onclick = () => {
                    appState.game.level = btn.getAttribute('data-level');
                    render();
                };
            });

            document.querySelectorAll('.play-mode-card').forEach(card => {
                card.onclick = () => {
                    const mode = card.getAttribute('data-mode');
                    startDiceGame(appState.game.level, mode);
                };
            });

            // Profile Form
            const profileForm = document.getElementById('profile-form');
            if (profileForm) {
                profileForm.onsubmit = (e) => {
                    e.preventDefault();
                    appState.student.name = document.getElementById('prof-name').value.trim();
                    appState.student.className = document.getElementById('prof-class').value;
                    appState.student.attendanceNumber = document.getElementById('prof-attendance').value.trim();
                    appState.student.school = document.getElementById('prof-school').value.trim();
                    saveState();
                    alert("Profile updated successfully!");
                };
            }

            // Game Actions
            const quitGame = document.getElementById('quit-game');
            if (quitGame) {
                quitGame.onclick = () => {
                    appState.currentView = 'dashboard';
                    render();
                };
            }

            const rollDiceBtn = document.getElementById('roll-dice-btn');
            if (rollDiceBtn) {
                rollDiceBtn.onclick = () => {
                    appState.game.isRolling = true;
                    render();
                    setTimeout(() => {
                        const roll = Math.floor(Math.random() * 6) + 1;
                        appState.game.diceValue = roll;
                        appState.game.isRolling = false;
                        // Select cell based on roll modulo 9
                        const targetCellIndex = (roll - 1) % 9;
                        appState.game.selectedCell = targetCellIndex;
                        appState.game.currentQuestion = appState.game.bingoBoard[targetCellIndex].question;
                        appState.game.selectedOption = null;
                        appState.game.isAnswerChecked = false;
                        appState.game.showHint = false;
                        render();
                    }, 500);
                };
            }

            const hintBtn = document.getElementById('hint-btn');
            if (hintBtn) {
                hintBtn.onclick = () => {
                    appState.game.showHint = true;
                    render();
                };
            }

            document.querySelectorAll('.quiz-option-btn').forEach(btn => {
                btn.onclick = () => {
                    if (appState.game.isAnswerChecked) return;
                    appState.game.selectedOption = parseInt(btn.getAttribute('data-index'));
                    render();
                };
            });

            const checkAnswerBtn = document.getElementById('check-answer-btn');
            if (checkAnswerBtn) {
                checkAnswerBtn.onclick = () => {
                    const currentQ = appState.game.currentQuestion;
                    const isCorrect = appState.game.selectedOption === currentQ.correctAnswerIndex;

                    appState.game.isAnswerChecked = true;
                    appState.game.isCorrect = isCorrect;

                    appState.stats.totalDone++;
                    if (isCorrect) {
                        appState.stats.correctCount++;
                        appState.game.correctThisSession++;
                        appState.game.scoreThisSession += 10;
                        appState.stats.totalScore += 10;
                        appState.stats.streak++;
                        // Mark cell on board
                        if (appState.game.selectedCell !== null) {
                            appState.game.bingoBoard[appState.game.selectedCell].marked = true;
                        }
                    } else {
                        appState.stats.incorrectCount++;
                        appState.game.incorrectThisSession++;
                        appState.stats.streak = 0;
                    }

                    // Check achievements
                    if (appState.stats.totalDone >= 1) appState.stats.badges[0].earned = true;
                    if (appState.stats.totalScore >= 50) appState.stats.badges[2].earned = true;

                    // Check if Bingo (all cells marked)
                    const allMarked = appState.game.bingoBoard.every(c => c.marked);
                    if (allMarked) {
                        appState.stats.bingosCompleted++;
                        appState.stats.badges[1].earned = true;
                    }

                    saveState();
                    render();
                };
            }

            const nextBingoTurn = document.getElementById('next-bingo-turn');
            if (nextBingoTurn) {
                nextBingoTurn.onclick = () => {
                    appState.game.currentQuestion = null;
                    appState.game.selectedCell = null;
                    render();
                };
            }

            // Settings & Reset
            const settingsLang = document.getElementById('settings-lang-btn');
            if (settingsLang) {
                settingsLang.onclick = () => {
                    appState.lang = appState.lang === 'id' ? 'en' : 'id';
                    render();
                };
            }

            const settingsTheme = document.getElementById('settings-theme-btn');
            if (settingsTheme) {
                settingsTheme.onclick = () => {
                    appState.darkMode = !appState.darkMode;
                    saveState();
                    render();
                };
            }

            const resetBtn = document.getElementById('reset-progress-btn');
            if (resetBtn) {
                resetBtn.onclick = () => {
                    if (confirm("Are you sure you want to reset all game progress?")) {
                        localStorage.clear();
                        location.reload();
                    }
                };
            }
        }

        function startDiceGame(level, mode) {
            let pool = questionBank.filter(q => q.level === level);
            if (pool.length < 9) {
                pool = questionBank.filter(q => q.level === 'STARTER');
            }
            // Shuffle and pick 9 questions for 3x3 Bingo board
            const shuffled = [...pool].sort(() => 0.5 - Math.random());
            const board = shuffled.slice(0, 9).map(q => ({ question: q, marked: false }));

            appState.game = {
                level: level,
                mode: mode,
                diceValue: 1,
                isRolling: false,
                bingoBoard: board,
                selectedCell: null,
                currentQuestion: null,
                selectedOption: null,
                isAnswerChecked: false,
                isCorrect: false,
                scoreThisSession: 0,
                correctThisSession: 0,
                incorrectThisSession: 0,
                showHint: false,
                sessionSeconds: 0
            };
            appState.currentView = 'bingoGrid';
            render();
        }

        window.onload = function() {
            loadState();
            startGlobalTimer();
            if (appState.student.name && appState.currentView === 'welcome') {
                appState.currentView = 'dashboard';
            }
            render();
        };
    </script>
</body>
</html>
